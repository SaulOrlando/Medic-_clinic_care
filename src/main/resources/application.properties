spring.application.name=MediclinicApp
server.port=8081

# ============================================
# Terminal output
# ============================================
spring.output.ansi.enabled=never

# ============================================
# SQL Server - Windows Authentication
# ============================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=SistemaClinico;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:mediclinic_app}
spring.datasource.password=${DB_PASSWORD:Med1cl1nic!2024}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ============================================
# JPA / Hibernate
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.defer-datasource-initialization=true

# ============================================
# Multipart / Subidas de archivos
# ============================================
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB