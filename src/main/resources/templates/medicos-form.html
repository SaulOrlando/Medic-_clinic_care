<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: layout(~{::content})}">

<th:block th:fragment="content">

    <div class="pacientes-alerts">
        <div th:if="${error}" class="alert alert-error animate-fade-in">
            <span class="material-symbols-outlined alert-icon" style="font-size: 18px;">error</span>
            <span th:text="${error}">Ocurrió un error.</span>
        </div>
    </div>

    <div class="pacientes-header">
        <div class="pacientes-header-text">
            <nav class="breadcrumb">
                <span class="breadcrumb-item"><a href="/medicos">Médicos</a></span>
                <span class="breadcrumb-separator">/</span>
                <span class="breadcrumb-item"
                      th:text="${modo == 'crear'} ? 'Nuevo Médico' : 'Editar Médico'">Nuevo Médico</span>
            </nav>
            <h2 class="page-title"
                th:text="${modo == 'crear'} ? 'Registrar Nuevo Médico' : 'Editar Médico'">Registrar Nuevo Médico</h2>
            <p class="page-subtitle"
               th:text="${modo == 'crear'} ? 'Ingresa los datos del médico. Se creará automáticamente su cuenta de usuario con rol Médico.' : 'Actualiza los datos del médico.'">
                Ingresa los datos del médico.
            </p>
        </div>
    </div>

    <div class="card pacientes-form-card">
        <div class="card-body">

            <form th:object="${medicoForm}" method="post" id="medicoForm"
                  th:action="${modo == 'crear'} ? @{/medicos/guardar} : @{/medicos/{id}/editar(id=${medicoForm.idMedico})}"
                  class="pacientes-form">

                <div class="pacientes-form-grid">

                    <div class="form-group">
                        <label class="form-label" for="nombreCompleto">Nombre Completo *</label>
                        <input type="text" class="form-control" id="nombreCompleto"
                               th:field="*{nombreCompleto}" placeholder="Dr. Juan Pérez" required maxlength="150"/>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="correo">Correo Electrónico *</label>
                        <input type="email" class="form-control" id="correo"
                               th:field="*{correo}" placeholder="doctor@mediclinic.com" required maxlength="150"/>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="telefono">Teléfono *</label>
                        <input type="tel" class="form-control" id="telefono"
                               th:field="*{telefono}" placeholder="(555) 123-4567" required maxlength="20"/>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="especialidad">Especialidad *</label>
                        <select class="form-control" id="especialidad" th:field="*{especialidad}" required>
                            <option value="">Seleccionar especialidad...</option>
                            <option th:each="esp : ${opcionesEspecialidad}"
                                    th:value="${esp.key}" th:text="${esp.value}">Especialidad</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="numeroLicencia">Número de Licencia *</label>
                        <input type="text" class="form-control" id="numeroLicencia"
                               th:field="*{numeroLicencia}" placeholder="MD-12345" required maxlength="50"/>
                        <small class="form-hint" id="licenciaHint" style="display:none;"></small>
                    </div>

                </div>

                <div class="form-actions">
                    <a th:href="@{/medicos}" class="btn btn-outline">Cancelar</a>
                    <button type="submit" class="btn btn-primary"
                            th:text="${modo == 'crear'} ? 'Registrar Médico' : 'Guardar Cambios'">Registrar Médico</button>
                </div>

            </form>
        </div>
    </div>

    <script th:if="${modo == 'crear'}" th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            var licenciaInput = document.getElementById('numeroLicencia');
            var hint = document.getElementById('licenciaHint');
            var debounceTimer;

            licenciaInput.addEventListener('input', function() {
                clearTimeout(debounceTimer);
                var licencia = licenciaInput.value.trim();
                if (licencia.length < 3) {
                    hint.style.display = 'none';
                    return;
                }
                debounceTimer = setTimeout(function() {
                    fetch('/medicos/existe-licencia?licencia=' + encodeURIComponent(licencia))
                        .then(function(r) { return r.json(); })
                        .then(function(data) {
                            hint.style.display = 'block';
                            if (data.duplicado) {
                                hint.textContent = 'Esta licencia ya está registrada.';
                                hint.className = 'form-hint form-hint-error';
                                hint.style.color = 'var(--color-error)';
                            } else {
                                hint.textContent = 'Licencia disponible.';
                                hint.className = 'form-hint form-hint-success';
                                hint.style.color = 'var(--color-success)';
                            }
                        });
                }, 300);
            });
        });
    </script>

</th:block>
</html>
