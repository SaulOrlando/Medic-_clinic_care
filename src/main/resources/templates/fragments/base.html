<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<!-- ============================================
     Base Layout — MediClinic Care
     Use: th:replace="~{fragments/base :: layout(~{::content})}"
     ============================================ -->

<!-- Fragment: HTML Head -->
<th:fragment th:fragment="head(title)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MediClinic Care — Sistema de Gestión Clínica">
    <title th:text="${title} ?: 'MediClinic Care'">MediClinic Care</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/design-system.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231B6CB0'/%3E%3Cpath d='M16 7v18M7 16h18' stroke='white' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
</th:fragment>

<!-- Fragment: Header -->
<th:fragment th:fragment="header">
<header class="app-header">
    <div class="header-left">
        <button class="header-toggle" id="sidebarToggle" aria-label="Alternar menú lateral">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="12" x2="21" y2="12"/>
                <line x1="3" y1="6" x2="21" y2="6"/>
                <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
        </button>
        <a href="/" class="header-brand">
            <div class="header-logo" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2v20"/>
                    <path d="M2 12h20"/>
                </svg>
            </div>
            <span class="header-brand-text">MediClinic Care</span>
        </a>
    </div>

    <div class="header-right">
        <div class="header-user">
            <div class="header-user-avatar" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
            </div>
            <div class="header-user-info">
                <span class="header-user-name" th:text="${usuario?.nombre} ?: 'Usuario'">Usuario</span>
                <span class="header-user-role" th:text="${usuario?.rol} ?: 'Rol'">Rol</span>
            </div>
        </div>
        <a href="/logout" class="header-logout" title="Cerrar sesión" aria-label="Cerrar sesión">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
        </a>
    </div>
</header>
</th:fragment>

<!-- Fragment: Sidebar -->
<th:fragment th:fragment="sidebar">
<aside class="app-sidebar" id="appSidebar">
    <nav class="sidebar-nav" aria-label="Navegación principal">

        <!-- General -->
        <div class="sidebar-section">
            <span class="sidebar-section-title">General</span>
            <ul class="sidebar-menu">
                <li>
                    <a href="/dashboard" class="sidebar-link">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="7" height="7"/>
                            <rect x="14" y="3" width="7" height="7"/>
                            <rect x="14" y="14" width="7" height="7"/>
                            <rect x="3" y="14" width="7" height="7"/>
                        </svg>
                        <span>Dashboard</span>
                    </a>
                </li>
            </ul>
        </div>

        <!-- Citas (Recepcionista / Médico) -->
        <div class="sidebar-section"
             th:if="${usuario?.rol == 'RECEPCIONISTA' or usuario?.rol == 'MEDICO' or usuario?.rol == 'ADMINISTRADOR'}">
            <span class="sidebar-section-title">Citas</span>
            <ul class="sidebar-menu">
                <li>
                    <a href="/citas" class="sidebar-link">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                            <line x1="16" y1="2" x2="16" y2="6"/>
                            <line x1="8" y1="2" x2="8" y2="6"/>
                            <line x1="3" y1="10" x2="21" y2="10"/>
                        </svg>
                        <span>Agenda de Citas</span>
                    </a>
                </li>
            </ul>
        </div>

        <!-- Pacientes (Recepcionista / Médico) -->
        <div class="sidebar-section"
             th:if="${usuario?.rol == 'RECEPCIONISTA' or usuario?.rol == 'MEDICO' or usuario?.rol == 'ADMINISTRADOR'}">
            <span class="sidebar-section-title">Pacientes</span>
            <ul class="sidebar-menu">
                <li>
                    <a href="/pacientes" class="sidebar-link">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                        </svg>
                        <span>Registro de Pacientes</span>
                    </a>
                </li>
            </ul>
        </div>

        <!-- Consultas (Médico) -->
        <div class="sidebar-section"
             th:if="${usuario?.rol == 'MEDICO' or usuario?.rol == 'ADMINISTRADOR'}">
            <span class="sidebar-section-title">Consultas</span>
            <ul class="sidebar-menu">
                <li>
                    <a href="/consultas" class="sidebar-link">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                            <line x1="16" y1="13" x2="8" y2="13"/>
                            <line x1="16" y1="17" x2="8" y2="17"/>
                            <polyline points="10 9 9 9 8 9"/>
                        </svg>
                        <span>Consultas Médicas</span>
                    </a>
                </li>
            </ul>
        </div>

        <!-- Administración (Administrador) -->
        <div class="sidebar-section" th:if="${usuario?.rol == 'ADMINISTRADOR'}">
            <span class="sidebar-section-title">Administración</span>
            <ul class="sidebar-menu">
                <li>
                    <a href="/medicos" class="sidebar-link">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                        </svg>
                        <span>Médicos</span>
                    </a>
                </li>
                <li>
                    <a href="/medicamentos" class="sidebar-link">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
                        </svg>
                        <span>Medicamentos</span>
                    </a>
                </li>
                <li>
                    <a href="/categorias-medicamentos" class="sidebar-link">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="8" y1="6" x2="21" y2="6"/>
                            <line x1="8" y1="12" x2="21" y2="12"/>
                            <line x1="8" y1="18" x2="21" y2="18"/>
                            <line x1="3" y1="6" x2="3.01" y2="6"/>
                            <line x1="3" y1="12" x2="3.01" y2="12"/>
                            <line x1="3" y1="18" x2="3.01" y2="18"/>
                        </svg>
                        <span>Categorías de Medicamentos</span>
                    </a>
                </li>
            </ul>
        </div>

    </nav>
</aside>
</th:fragment>

<!-- Fragment: Main Content Wrapper -->
<th:fragment th:fragment="content(content)">
<body class="app-body">

    <div class="app-layout">
        <!-- Header -->
        <div th:replace="~{fragments/base :: header}"></div>

        <!-- Sidebar -->
        <div th:replace="~{fragments/base :: sidebar}"></div>

        <!-- Overlay for mobile sidebar -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- Main Content -->
        <main class="app-main" role="main">
            <div class="main-content" th:insert="${content}">
                <!-- Page content injected here -->
            </div>
        </main>
    </div>

    <!-- Sidebar toggle script -->
    <script>
        (function () {
            'use strict';
            var toggle = document.getElementById('sidebarToggle');
            var sidebar = document.getElementById('appSidebar');
            var overlay = document.getElementById('sidebarOverlay');

            if (toggle && sidebar) {
                toggle.addEventListener('click', function () {
                    sidebar.classList.toggle('is-open');
                    overlay.classList.toggle('is-visible');
                });
            }
            if (overlay) {
                overlay.addEventListener('click', function () {
                    sidebar.classList.remove('is-open');
                    overlay.classList.remove('is-visible');
                });
            }
        })();
    </script>

</body>
</th:fragment>

</html>
