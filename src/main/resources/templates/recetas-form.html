<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: layout(~{::content})}">

<th:block th:fragment="content">

    <!-- Alerts -->
    <div class="usuarios-alerts">
        <div th:if="${exito}" class="alert alert-success animate-fade-in">
            <span class="material-symbols-outlined alert-icon" style="font-size: 18px;">check_circle</span>
            <span th:text="${exito}">Operación correcta.</span>
        </div>
        <div th:if="${error}" class="alert alert-error animate-fade-in">
            <span class="material-symbols-outlined alert-icon" style="font-size: 18px;">error</span>
            <span th:text="${error}">Ocurrió un error.</span>
        </div>
    </div>

    <!-- Header Section -->
    <div class="recetas-header">
        <div class="consultas-header-text">
            <h2 class="page-title"
                th:text="${modo == 'crear'} ? 'Nueva Receta Médica' : 'Editar Medicamento'">Nueva Receta Médica</h2>
            <p class="page-subtitle">Agregue los medicamentos prescritos para la consulta seleccionada.</p>
        </div>
    </div>

    <!-- Form Card -->
    <form th:object="${receta}" method="post"
          th:action="${modo == 'crear'} ? @{/recetas/guardar} : @{/recetas/{id}/editar(id=${receta.idRecetaDetalle})}"
          class="recetas-form-card">

        <div class="consultas-form-body" style="padding: 0;">

            <!-- Consulta selection (only in create mode when no consulta passed) -->
            <div class="consultas-form-field" th:if="${modo == 'crear' and consulta == null}">
                <label for="idConsulta">Consulta *</label>
                <select id="idConsulta" name="idConsulta" class="form-input" required>
                    <option value="">Seleccione la consulta...</option>
                    <option th:each="c : ${consultas}"
                            th:value="${c.idConsulta}"
                            th:text="'Consulta #' + ${c.idConsulta} + ' · ' + ${c.cita?.paciente?.nombres} + ' ' + ${c.cita?.paciente?.apellidos} + ' · ' + ${#temporals.format(c.cita?.fechaHora, 'dd/MM/yyyy HH:mm')}">
                        Consulta
                    </option>
                </select>
            </div>

            <!-- Empty consultas message -->
            <div class="consultas-form-field" th:if="${modo == 'crear' and consulta == null and sinConsultas}">
                <div class="alert alert-warning">
                    <span class="material-symbols-outlined alert-icon" style="font-size: 18px;">info</span>
                    <span>No tiene consultas registradas. Registre una consulta médica en <a th:href="@{/consultas}">Consulta Médica</a> antes de generar una receta.</span>
                </div>
            </div>

            <!-- Read-only consulta info when editing/adding to existing consulta -->
            <div class="consultas-form-field" th:if="${consulta != null}">
                <label>Consulta seleccionada</label>
                <input type="hidden" name="idConsulta" th:value="${consulta.idConsulta}" />
                <div class="form-input" style="display:flex;align-items:center;gap:12px;color:var(--color-text);cursor:default;">
                    <span class="material-symbols-outlined" style="font-size:20px;">monitor_heart</span>
                    <span th:text="'Consulta #' + ${consulta.idConsulta} + ' · ' + ${consulta.cita?.paciente?.nombres} + ' ' + ${consulta.cita?.paciente?.apellidos}">
                        Consulta
                    </span>
                </div>
            </div>

            <hr class="consultas-form-divider"/>

            <!-- Medicamento -->
            <div class="consultas-form-field">
                <label for="medicamento.idMedicamento">Medicamento *</label>
                <select id="medicamento.idMedicamento" name="medicamento.idMedicamento" class="form-input" required>
                    <option value="">Seleccione el medicamento...</option>
                    <option th:each="m : ${medicamentos}"
                            th:value="${m.idMedicamento}"
                            th:selected="${receta.medicamento?.idMedicamento == m.idMedicamento}"
                            th:text="${m.nombreComercial} + ' ' + ${m.concentracion} + ' (Stock: ' + ${m.stockDisponible} + ')'">
                        Medicamento
                    </option>
                </select>
            </div>

            <!-- Dosis -->
            <div class="consultas-form-field">
                <label for="dosis">Dosis</label>
                <input type="text" id="dosis" class="form-input"
                       th:field="*{dosis}" maxlength="255" placeholder="ej. 1 tableta" />
            </div>

            <!-- Cantidad (para stock) -->
            <div class="consultas-form-field">
                <label for="cantidad">Cantidad *</label>
                <input type="number" id="cantidad" class="form-input"
                       th:field="*{cantidad}" min="1" step="1" placeholder="Unidades a dispensar" required />
            </div>

            <!-- Frecuencia -->
            <div class="consultas-form-field">
                <label for="frecuencia">Frecuencia</label>
                <input type="text" id="frecuencia" class="form-input"
                       th:field="*{frecuencia}" maxlength="255" placeholder="ej. Diariamente" />
            </div>

            <!-- Duración -->
            <div class="consultas-form-field">
                <label for="duracion">Duración</label>
                <input type="text" id="duracion" class="form-input"
                       th:field="*{duracion}" maxlength="255" placeholder="ej. 90 días" />
            </div>

            <!-- Indicaciones -->
            <div class="consultas-form-field" style="grid-column: 1 / -1;">
                <label for="indicaciones">Indicaciones / Notas *</label>
                <textarea id="indicaciones" rows="3"
                          th:field="*{indicaciones}"
                          placeholder="ej. Tomar por la mañana, antes de los alimentos" required></textarea>
            </div>
        </div>

        <div class="recetas-form-actions">
            <a th:href="${consulta != null} ? @{/recetas/consulta/{id}(id=${consulta.idConsulta})} : @{/recetas}"
               class="btn btn-outline">Cancelar</a>
            <button type="submit" class="btn btn-primary"
                    th:text="${modo == 'crear'} ? 'Agregar a la Receta' : 'Guardar Cambios'">Agregar</button>
        </div>
    </form>

</th:block>

</html>
