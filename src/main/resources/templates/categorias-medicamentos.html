<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
       th:replace="~{fragments/base :: layout(~{::content})}">

<th:block th:fragment="content">

    <div class="page-header animate-fade-in">
        <div>
            <h1 class="page-title">Categorías de Medicamentos</h1>
            <p class="page-subtitle">Gestiona las categorías del inventario farmacéutico.</p>
        </div>
        <a href="#" th:href="@{/categorias-medicamentos/nuevo}" class="btn btn-primary">
            <span class="material-symbols-outlined">add</span>
            Nueva Categoría
        </a>
    </div>

    <div th:if="${exito}" class="alert alert-success animate-slide-down" role="alert">
        <span class="material-symbols-outlined alert-icon">check_circle</span>
        <span th:text="${exito}"></span>
    </div>

    <div th:if="${error}" class="alert alert-error animate-slide-down" role="alert">
        <span class="material-symbols-outlined alert-icon">error</span>
        <span th:text="${error}"></span>
    </div>

    <div class="data-table-wrapper animate-fade-in">
        <table class="data-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="cat : ${categorias}">
                    <td th:text="${cat.idCategoria}"></td>
                    <td th:text="${cat.nombre}"></td>
                    <td th:text="${cat.descripcion != null ? cat.descripcion : '—'}">—</td>
                    <td>
                        <span th:if="${#lists.size(cat.medicamentos) == 0}" class="badge badge-success">Activa</span>
                        <span th:if="${#lists.size(cat.medicamentos) > 0}" class="badge badge-warning">En uso</span>
                    </td>
                    <td>
                        <div class="flex" style="gap: var(--space-2);">
                            <a th:href="@{/categorias-medicamentos/{id}/editar(id=${cat.idCategoria})}" class="btn btn-secondary btn-sm">
                                <span class="material-symbols-outlined" style="font-size:16px;">edit</span>
                            </a>
                            <a th:href="@{/categorias-medicamentos/{id}/eliminar(id=${cat.idCategoria})}" class="btn btn-danger btn-sm"
                               onclick="return confirm('¿Está seguro de eliminar esta categoría?');">
                                <span class="material-symbols-outlined" style="font-size:16px;">delete</span>
                            </a>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(categorias)}">
                    <td colspan="5" class="text-center" style="padding: var(--space-8); color: var(--color-text-muted);">
                        No hay categorías registradas.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</th:block>

</html>
