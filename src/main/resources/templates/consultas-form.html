<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: layout(~{::content})}">

<th:block th:fragment="content">

    <!-- Alerts -->
    <div class="usuarios-alerts">
        <div th:if="${exito}" class="alert alert-success animate-fade-in">
            <span class="material-symbols-outlined alert-icon" style="font-size: 18px;">check_circle</span>
            <span th:text="${exito}">Operacion correcta.</span>
        </div>
        <div th:if="${error}" class="alert alert-error animate-fade-in">
            <span class="material-symbols-outlined alert-icon" style="font-size: 18px;">error</span>
            <span th:text="${error}">Ocurrio un error.</span>
        </div>
    </div>

    <!-- Breadcrumb -->
    <nav class="breadcrumb animate-fade-in">
        <span class="breadcrumb-item"><a href="/panel">Inicio</a></span>
        <span class="material-symbols-outlined breadcrumb-separator">chevron_right</span>
        <span class="breadcrumb-item"><a href="/consultas">Consultas</a></span>
        <span class="material-symbols-outlined breadcrumb-separator">chevron_right</span>
        <span class="breadcrumb-item" th:text="${modo == 'crear'} ? 'Nueva Consulta' : 'Editar Consulta'">Consulta</span>
    </nav>

    <!-- Page Header -->
    <div class="page-header animate-fade-in">
        <div>
            <h1 class="page-title">Nota de Consulta</h1>
        </div>
    </div>

    <!-- Patient Info Bar -->
    <div class="animate-fade-in" style="display: flex; align-items: center; gap: var(--space-4); background-color: var(--color-surface-container-lowest); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--space-4) var(--space-5); margin-bottom: var(--space-6); box-shadow: var(--shadow-ambient);">
        <div style="width: 44px; height: 44px; border-radius: 50%; background-color: var(--color-primary); color: var(--color-text-inverse); display: flex; align-items: center; justify-content: center; font-weight: var(--font-weight-semibold); font-size: var(--font-size-sm); flex-shrink: 0;"
             th:text="${cita?.paciente?.nombres?.substring(0,1) ?: '?'}">P</div>
        <div style="flex: 1; min-width: 0;">
            <p style="font-weight: var(--font-weight-semibold); color: var(--color-text); font-size: var(--font-size-base);"
               th:text="${cita?.paciente?.nombres + ' ' + cita?.paciente?.apellidos}">Nombre Paciente</p>
            <p style="font-size: var(--font-size-xs); color: var(--color-text-muted);"
               th:text="'N Historia: #' + (${cita?.paciente?.codigoExpediente} ?: '---') + ' | Nacimiento: ' + (${cita?.paciente?.fechaNacimiento != null} ? ${#temporals.format(cita.paciente.fechaNacimiento, 'dd MMM yyyy')} : 'N/A')">
                N Historia: #--- | Nacimiento: 01 Ene 1980
            </p>
        </div>
    </div>

    <!-- Form Card -->
    <form th:object="${consulta}" method="post"
          th:action="${modo == 'crear'} ? @{/consultas/guardar} : @{/consultas/{id}/editar(id=${consulta.idConsulta})}"
          class="consultas-form-card animate-fade-in">

        <!-- Hidden fields -->
        <input type="hidden" th:field="*{cita.idCita}" />
        <input type="hidden" name="emitirReceta" id="emitirReceta" value="false" />

        <!-- Form Fields -->
        <div class="consultas-form-body">

            <!-- Motivo de Consulta -->
            <div class="consultas-form-field">
                <label for="motivoConsulta">Motivo de Consulta / Razon Principal *</label>
                <input type="text" id="motivoConsulta" class="form-input"
                       th:field="*{motivoConsulta}"
                       placeholder="ej. Tos persistente y fiebre leve" required maxlength="1000" />
            </div>

            <!-- Sintomas -->
            <div class="consultas-form-field">
                <label for="sintomatologia">Sintomas e Historia de la Enfermedad Actual</label>
                <textarea id="sintomatologia" rows="4"
                          th:field="*{sintomatologia}"
                          placeholder="Describe sintomas, duracion, gravedad..."></textarea>
            </div>

            <hr class="consultas-form-divider"/>

            <!-- Diagnostico -->
            <div class="consultas-form-field">
                <div class="consultas-cie-header">
                    <label for="diagnostico">Evaluacion / Diagnostico</label>
                    <button type="button" class="consultas-cie-add" id="btnAddCie">
                        <span class="material-symbols-outlined">add</span> Anadir Codigo CIE-10
                    </button>
                </div>
                <div class="consultas-diagnosis-wrapper">
                    <span class="material-symbols-outlined">stethoscope</span>
                    <input type="text" id="diagnostico" class="form-input"
                           th:field="*{diagnostico}"
                           placeholder="Buscar o escribir diagnostico..." />
                </div>
                <div class="consultas-cie-chips" id="cieChips"></div>
            </div>

            <!-- Plan de Tratamiento -->
            <div class="consultas-form-field">
                <label for="planTratamiento">Plan de Tratamiento y Notas de Recetas</label>
                <textarea id="planTratamiento" rows="4"
                          th:field="*{planTratamiento}"
                          placeholder="Detalle el plan, los proximos pasos o los cambios de medicacion..."></textarea>
            </div>
        </div>

        <!-- Footer Actions -->
        <div class="consultas-form-footer">
            <a href="/consultas" class="btn btn-outline">
                Cancelar
            </a>
            <div style="display: flex; gap: var(--space-3);">
                <button type="submit" class="btn btn-outline" id="btnGuardarBorrador">
                    <span class="material-symbols-outlined" style="font-size: 18px;">save</span>
                    Guardar Borrador
                </button>
                <button type="submit" class="btn btn-primary" id="btnGuardarReceta"
                        th:formaction="${modo == 'crear'} ? @{/consultas/guardar} : @{/consultas/{id}/editar(id=${consulta.idConsulta})}">
                    <span class="material-symbols-outlined" style="font-size: 18px;">prescriptions</span>
                    Guardar y Emitir Receta
                </button>
            </div>
        </div>
    </form>

    <script th:inline="javascript">
        (function () {
            'use strict';

            var cieInput = document.getElementById('diagnostico');
            var cieChips = document.getElementById('cieChips');
            var btnAddCie = document.getElementById('btnAddCie');
            var cieCodes = [];

            function renderCieChips() {
                cieChips.innerHTML = '';
                cieCodes.forEach(function (code, index) {
                    var chip = document.createElement('span');
                    chip.className = 'consultas-cie-chip';
                    chip.innerHTML = code +
                        ' <button type="button" class="consultas-cie-chip-remove" data-index="' + index + '">' +
                        '<span class="material-symbols-outlined">close</span></button>';
                    cieChips.appendChild(chip);
                });

                cieChips.querySelectorAll('.consultas-cie-chip-remove').forEach(function (btn) {
                    btn.addEventListener('click', function () {
                        var idx = parseInt(this.getAttribute('data-index'));
                        cieCodes.splice(idx, 1);
                        renderCieChips();
                    });
                });
            }

            if (btnAddCie) {
                btnAddCie.addEventListener('click', function () {
                    var val = cieInput.value.trim();
                    if (val && cieCodes.indexOf(val) === -1) {
                        cieCodes.push(val);
                        renderCieChips();
                        cieInput.value = '';
                        cieInput.focus();
                    }
                });
            }

            if (cieInput) {
                cieInput.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        btnAddCie.click();
                    }
                });
            }

            var emitirReceta = document.getElementById('emitirReceta');
            var btnGuardarBorrador = document.getElementById('btnGuardarBorrador');
            var btnGuardarReceta = document.getElementById('btnGuardarReceta');
            if (btnGuardarBorrador && emitirReceta) {
                btnGuardarBorrador.addEventListener('click', function () {
                    emitirReceta.value = 'false';
                });
            }
            if (btnGuardarReceta && emitirReceta) {
                btnGuardarReceta.addEventListener('click', function () {
                    emitirReceta.value = 'true';
                });
            }
        })();
    </script>

</th:block>

</html>
