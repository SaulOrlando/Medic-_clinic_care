<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: layout(~{::content})}">

<th:block th:fragment="content">

    <div class="usuarios-alerts">
        <div th:if="${error}" class="alert alert-error animate-fade-in">
            <span class="material-symbols-outlined alert-icon" style="font-size: 18px;">error</span>
            <span th:text="${error}">Ocurrió un error.</span>
        </div>
    </div>

    <div class="consultas-header">
        <div class="consultas-header-text">
            <h2 class="page-title" th:text="${modo == 'editar' ? 'Editar Cita' : 'Nueva Cita'}">Nueva Cita</h2>
            <p class="page-subtitle" th:text="${modo == 'editar' ? 'Actualice los datos de la cita.' : 'Complete los datos para programar una nueva cita médica.'}">Complete los datos.</p>
        </div>
    </div>

    <div class="consultas-table-card">
        <form th:action="${modo == 'editar'} ? @{/citas/{id}/editar(id=${cita.idCita})} : @{/citas/guardar}"
              method="post" class="consultas-form">

            <div class="form-grid">
                <div class="form-group">
                    <label for="idPaciente">Paciente *</label>
                    <select id="idPaciente" name="idPaciente" class="form-control" required>
                        <option value="">Seleccione un paciente...</option>
                        <option th:each="p : ${pacientes}"
                                th:value="${p.idPaciente}"
                                th:text="${p.nombres + ' ' + p.apellidos + ' (' + p.documentoIdentidad + ')'}"
                                th:selected="${cita.paciente != null and cita.paciente.idPaciente == p.idPaciente}">
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="idMedico">Médico *</label>
                    <select id="idMedico" name="idMedico" class="form-control" required>
                        <option value="">Seleccione un médico...</option>
                        <option th:each="m : ${medicos}"
                                th:value="${m.idMedico}"
                                th:text="${m.usuario?.nombreCompleto + ' - ' + m.especialidad}"
                                th:selected="${cita.medico != null and cita.medico.idMedico == m.idMedico}">
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="fechaHora">Fecha y Hora *</label>
                    <input type="datetime-local" id="fechaHora" name="fechaHora" class="form-control"
                           th:value="${cita.fechaHora != null} ? ${#temporals.format(cita.fechaHora, 'yyyy-MM-dd HH:mm')}"
                           required />
                </div>

                <div class="form-group">
                    <label for="duracionMinutos">Duración (minutos) *</label>
                    <select id="duracionMinutos" name="duracionMinutos" class="form-control" required>
                        <option value="15">15 minutos</option>
                        <option value="30" selected>30 minutos</option>
                        <option value="45">45 minutos</option>
                        <option value="60">60 minutos</option>
                    </select>
                </div>
            </div>

            <div class="form-actions">
                <a href="/citas" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary">
                    <span class="material-symbols-outlined" style="font-size: 18px;">save</span>
                    <span th:text="${modo == 'editar' ? 'Actualizar' : 'Programar Cita'}">Programar Cita</span>
                </button>
            </div>
        </form>
    </div>

</th:block>

</html>
