<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MediClinic Care — Inicio de sesión">
    <title>Iniciar Sesión — MediClinic Care</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Design System -->
    <link rel="stylesheet" th:href="@{/css/design-system.css}">
    <!-- Login Styles -->
    <link rel="stylesheet" th:href="@{/css/login.css}">

    <!-- Favicon (inline SVG as data URI) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231B6CB0'/%3E%3Cpath d='M16 7v18M7 16h18' stroke='white' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>

<main class="login-page" role="main">
    <div class="login-container">

        <!-- Login Card -->
        <div class="login-card">
            <div class="login-card-body">

                <!-- Brand -->
                <header class="login-brand">
                    <!-- Medical cross logo -->
                    <div class="login-logo" aria-hidden="true">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2v20"/>
                            <path d="M2 12h20"/>
                            <path d="M5 5h4a3 3 0 0 1 0 6H5z"/>
                            <path d="M5 11h4a3 3 0 0 0 0 6H5z"/>
                            <path d="M15 5h4a3 3 0 0 1 0 6h-4z"/>
                            <path d="M15 11h4a3 3 0 0 0 0 6h-4z"/>
                        </svg>
                    </div>
                    <div>
                        <h1 class="login-title">MediClinic Care</h1>
                        <p class="login-subtitle">Sistema de Gestión Clínica</p>
                    </div>
                </header>

                <!-- Error Alert -->
                <div th:if="${param.error}" class="login-alert" role="alert">
                    <div class="alert alert-error">
                        <svg class="alert-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <line x1="12" y1="8" x2="12" y2="12"/>
                            <line x1="12" y1="16" x2="12.01" y2="16"/>
                        </svg>
                        <span>Correo electrónico o contraseña incorrectos. Por favor, intente de nuevo.</span>
                    </div>
                </div>

                <!-- Logout Alert -->
                <div th:if="${param.logout}" class="login-alert" role="status">
                    <div class="alert alert-success">
                        <svg class="alert-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                            <polyline points="22 4 12 14.01 9 11.01"/>
                        </svg>
                        <span>Cerró sesión exitosamente. Ingrese sus credenciales para continuar.</span>
                    </div>
                </div>

                <!-- Login Form -->
                <form class="login-form"
                      th:action="@{/login}"
                      method="post"
                      novalidate>

                    <!-- Email / Username -->
                    <div class="form-group">
                        <label class="form-label" for="username">Correo electrónico</label>
                        <input class="form-input"
                               type="email"
                               id="username"
                               name="username"
                               placeholder="usuario@mediclinic.com"
                               autocomplete="username"
                               autofocus
                               required>
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <label class="form-label" for="password">Contraseña</label>
                        <div class="input-wrapper">
                            <input class="form-input"
                                   type="password"
                                   id="password"
                                   name="password"
                                   placeholder="Ingrese su contraseña"
                                   autocomplete="current-password"
                                   required>
                            <!-- Show/Hide toggle -->
                            <button type="button"
                                    class="input-toggle"
                                    id="togglePassword"
                                    aria-label="Mostrar contraseña"
                                    title="Mostrar contraseña">
                                <!-- Eye open icon -->
                                <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                                <!-- Eye closed icon (hidden by default) -->
                                <svg class="icon-eye-off" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                     style="display: none;">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                    <line x1="1" y1="1" x2="23" y2="23"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Options row -->
                    <div class="login-options">
                        <label class="form-check">
                            <input class="form-check-input"
                                   type="checkbox"
                                   id="remember-me"
                                   name="remember-me">
                            <span class="form-check-label">Recordarme</span>
                        </label>
                        <a href="#" class="login-forgot" th:href="@{/recuperar-contrasena}">¿Olvidó su contraseña?</a>
                    </div>

                    <!-- Submit -->
                    <button type="submit" class="btn btn-primary btn-block login-submit" id="loginBtn">
                        Iniciar Sesión
                    </button>
                </form>

            </div>
        </div>

        <!-- Footer -->
        <footer class="login-footer">
            <p>
                <span class="login-footer-brand">MediClinic Care</span><br>
                Sistema de Gestión para Atención Primaria
            </p>
        </footer>

    </div>
</main>

<!-- Password Toggle Script -->
<script th:inline="javascript">
    (function () {
        'use strict';

        var toggleBtn = document.getElementById('togglePassword');
        var passwordInput = document.getElementById('password');
        var iconEye = toggleBtn.querySelector('.icon-eye');
        var iconEyeOff = toggleBtn.querySelector('.icon-eye-off');

        toggleBtn.addEventListener('click', function () {
            var isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';

            iconEye.style.display = isPassword ? 'none' : '';
            iconEyeOff.style.display = isPassword ? '' : 'none';

            toggleBtn.setAttribute('aria-label',
                isPassword ? 'Ocultar contraseña' : 'Mostrar contraseña');
            toggleBtn.setAttribute('title',
                isPassword ? 'Ocultar contraseña' : 'Mostrar contraseña');

            passwordInput.focus();
        });

        /* Add loading state on submit */
        var form = document.querySelector('.login-form');
        var loginBtn = document.getElementById('loginBtn');

        form.addEventListener('submit', function () {
            loginBtn.classList.add('is-loading');
            loginBtn.disabled = true;
        });
    })();
</script>

</body>
</html>
